syntax = "proto3";

package inctagram.post.v1;

import "google/protobuf/timestamp.proto";

message PostImage {
  string id = 1;
  string file_id = 2;
  string url = 3;
  int32 order = 4;
}

message Post {
  string id = 1;
  string owner_id = 2;
  string description = 3; // строго макс 500 символов
  repeated PostImage images = 4; 
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreatePostRequest {
  string owner_id = 1;
  string description = 2;
  repeated string file_ids = 3;
}

message CreatePostResponse {
  Post post = 1;
}

message UpdatePostRequest {
  string post_id = 1;
  string owner_id = 2;
  string description = 3;
}

message UpdatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string post_id = 1;
  string owner_id = 2;
}

message DeletePostResponse {
  bool success = 1;
}

message GetPostsByUserIdRequest {
  string owner_id = 1;
  optional string cursor = 2;
  int32 page_size = 3;
}

message GetPostsByUserIdResponse {
  repeated Post posts = 1;
  optional string next_cursor = 2;
  bool has_more = 3;
}

message GetLatestPostsRequest {
  int32 limit = 1;
}

message GetLatestPostsResponse {
  repeated Post posts = 1;
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string reply = 1;
}

message GetPostsCountByUserIdRequest {
  string owner_id = 1;
}

message GetPostsCountByUserIdResponse {
  int32 count = 1;
}

message GetPostByIdRequest {
  string post_id = 1;
}

message GetPostByIdResponse {
  Post post = 1;
}

service PostService {
  rpc GetSuperadminPostsPage(GetSuperadminPostsPageRequest) returns (GetSuperadminPostsPageResponse);
  rpc GetSuperadminPostPublishedView(GetSuperadminPostPublishedViewRequest) returns (GetSuperadminPostPublishedViewResponse);
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc GetPostsByUserId(GetPostsByUserIdRequest) returns (GetPostsByUserIdResponse);
  rpc GetLatestPosts(GetLatestPostsRequest) returns (GetLatestPostsResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetPostsCountByUserId(GetPostsCountByUserIdRequest) returns (GetPostsCountByUserIdResponse);
  rpc GetPostById(GetPostByIdRequest) returns (GetPostByIdResponse);
}

message SuperadminPostAuthorSnapshot {
  string user_id = 1;
  string source_version = 2;
  optional string username = 3;
  optional bool profile_exists = 4;
  optional bool is_deleted = 5;
}
message SuperadminPostImageView {
  string file_id = 1;
  optional string url = 2;
  optional int32 order = 3;
}
message SuperadminPostView {
  string post_id = 1;
  string user_id = 2;
  optional string username = 3;
  optional string description = 4;
  // Canonical persisted UTC milliseconds; no Timestamp/loader.longs conversion.
  string published_at = 5;
  repeated SuperadminPostImageView images = 6;
  optional SuperadminPostAuthorSnapshot user_snapshot = 7;
}
message GetSuperadminPostsPageRequest {
  optional int32 first = 1;
  optional string after = 2;
  optional string search_username = 3;
}
message SuperadminPostsPageInfo {
  optional string end_cursor = 1;
  optional bool has_next_page = 2;
}
message GetSuperadminPostsPageResponse {
  repeated SuperadminPostView items = 1;
  SuperadminPostsPageInfo page_info = 2;
}
enum SuperadminPostPublishedOutcome {
  SUPERADMIN_POST_PUBLISHED_OUTCOME_UNSPECIFIED = 0;
  SUPERADMIN_POST_PUBLISHED_OUTCOME_FOUND = 1;
  SUPERADMIN_POST_PUBLISHED_OUTCOME_NOT_FOUND = 2;
  SUPERADMIN_POST_PUBLISHED_OUTCOME_FILTERED = 3;
  SUPERADMIN_POST_PUBLISHED_OUTCOME_UNRESOLVED_AUTHOR = 4;
}
message GetSuperadminPostPublishedViewRequest {
  string post_id = 1;
  optional string search_username = 2;
  bool author_missing_confirmed = 3;
  optional string author_user_id = 4;
}
message GetSuperadminPostPublishedViewResponse {
  SuperadminPostPublishedOutcome outcome = 1;
  optional SuperadminPostView post = 2;
  optional string post_id = 3;
  optional string author_user_id = 4;
}
