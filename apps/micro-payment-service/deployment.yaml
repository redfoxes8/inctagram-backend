apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: GRPC_HOST
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: GRPC_HOST
             - name: GRPC_PORT
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: GRPC_PORT
             - name: DATABASE_URL
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: DATABASE_URL
             - name: PRISMA_DB_URL
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PRISMA_DB_URL
             - name: PRISMA_DB_URL_DIRECT
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PRISMA_DB_URL_DIRECT
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: RABBITMQ_URL
             - name: STRIPE_SECRET_KEY
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: STRIPE_SECRET_KEY
             - name: STRIPE_WEBHOOK_SECRET
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: STRIPE_WEBHOOK_SECRET
             - name: PAYPAL_CLIENT_ID
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYPAL_CLIENT_ID
             - name: PAYPAL_CLIENT_SECRET
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYPAL_CLIENT_SECRET
             - name: PAYPAL_WEBHOOK_ID
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYPAL_WEBHOOK_ID
             - name: PAYPAL_MODE
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYPAL_MODE
             - name: SUCCESS_PAYMENT_URL
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: SUCCESS_PAYMENT_URL
             - name: UNSUCCESS_PAYMENT_URL
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: UNSUCCESS_PAYMENT_URL
             - name: PAYMENT_PROVIDER_ENVIRONMENT
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYMENT_PROVIDER_ENVIRONMENT
             - name: PAYMENT_WEBHOOK_PROCESSING_TIMEOUT_SECONDS
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYMENT_WEBHOOK_PROCESSING_TIMEOUT_SECONDS
             - name: PAYMENT_OUTBOX_RELAY_ENABLED
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYMENT_OUTBOX_RELAY_ENABLED
             - name: PAYMENT_OUTBOX_RELAY_CRON
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYMENT_OUTBOX_RELAY_CRON
             - name: PAYMENT_OUTBOX_RELAY_BATCH_SIZE
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYMENT_OUTBOX_RELAY_BATCH_SIZE
             - name: PAYMENT_OUTBOX_RELAY_MAX_ATTEMPTS
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYMENT_OUTBOX_RELAY_MAX_ATTEMPTS
             - name: PAYMENT_OUTBOX_RELAY_BACKOFF_SECONDS
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYMENT_OUTBOX_RELAY_BACKOFF_SECONDS
             - name: PAYMENT_OUTBOX_RELAY_LOCK_TIMEOUT_SECONDS
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PAYMENT_OUTBOX_RELAY_LOCK_TIMEOUT_SECONDS
             - name: SUBSCRIPTION_LIFECYCLE_ENABLED
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: SUBSCRIPTION_LIFECYCLE_ENABLED
             - name: SUBSCRIPTION_CHECK_CRON
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: SUBSCRIPTION_CHECK_CRON
             - name: SUBSCRIPTION_LIFECYCLE_BATCH_SIZE
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: SUBSCRIPTION_LIFECYCLE_BATCH_SIZE
             - name: NODE_ENV
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: NODE_ENV
             - name: PORT
               valueFrom:
                 secretKeyRef:
                   name: micro-payment-service-10-07-2026-production-config-secret
                   key: PORT
